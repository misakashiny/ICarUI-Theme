<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>视频转速与升挡 · ICarUI 动态演示</title>
<link rel="stylesheet" href="demo.css">
</head>
<body>
<main>
  <header><a href="../../index.html" target="_blank" rel="noopener">ICarUI</a><span>模拟数据演示</span></header>
  <div class="workspace">
    <section class="stage" aria-label="动态转速仪表"><canvas id="display" width="720" height="720" aria-label="转速、车速、挡位和进气温度的模拟演示"></canvas></section>
    <section class="controls">
      <h1>转速与升挡</h1><p class="intro">分段灯带、金色火花、三重扩散波纹，与升挡提醒同步触发。</p>
      <div class="reading"><span>当前模拟转速</span><output id="rpmOutput">—</output><span>RPM</span></div>
      <p id="state" class="state" role="status">正在准备主题…</p>
      <div class="buttons"><button id="play" type="button">暂停演示</button><button id="restart" type="button">重新播放</button></div>
      <label class="slider-label" for="rpm">手动调整转速 <span id="manualHint">拖动后固定转速</span></label>
      <input id="rpm" type="range" min="0" max="6500" step="10" value="3000">
      <div class="range-labels"><span>0</span><span>升挡提醒 5400</span><span>6500</span></div>
      <div class="presets"><button data-rpm="3500">正常行驶</button><button data-rpm="5700">升挡提醒</button><button id="shift">模拟换挡</button></div>
      <label class="quiet"><input id="light" type="checkbox" checked> 开启提醒光效</label>
      <div class="effectToggles"><label class="quiet"><input id="sparks" type="checkbox" checked> 粒子火花</label><label class="quiet"><input id="ripples" type="checkbox" checked> 扩散波纹</label></div>
      <p class="source">自动演示：拉升 → 升挡提示 → 换挡回落 → 再次拉升。所有读数均为模拟数据。</p>
      <a class="download" href="视频转速_720x720.icarzip" download>下载 ICarUI 主题包</a>
      <p class="import-note">继续编辑：打开 ICarUI，在“主题 → 项目主题 → 视频转速”中找到这套主题。也可导入上面的主题包。</p>
    </section>
  </div>
  <footer><span>720 × 720 · ICarUI 原生节点绘制</span><span id="playState">模拟演示准备中</span></footer>
</main>
<div hidden><canvas id="cv" width="720" height="720"></canvas><div id="ctxMenu"></div></div>
<script src="../../js/spring.js"></script><script src="../../js/core/namespace.js"></script>
<script src="../../js/schema.js"></script><script src="../../js/node-effects.js"></script>
<script src="../../js/text-binding.js"></script><script src="../../js/control-library.js"></script>
<script src="../../js/model.js"></script><script src="../../js/validate.js"></script>
<script>window.readCanvasColors=()=>({out:'#000000',in:'#000000',text:'#d0cac1',textDim:'#77716a',textFaint:'#443c33',value:'#ffffff',accent:'#ff991b'});window.currentTheme=()=>({background:'#000000',value:'#fffdf6',label:'#c5c1b8',dim:'#6f6960'});</script>
<script src="../../js/canvas.js"></script><script src="../../js/advanced-primitives-proto.js"></script>
<script src="../../js/zip.js"></script><script src="../../js/pack.js"></script>
<script src="theme-data.js"></script><script src="demo.js"></script>
</body></html>
