<style>
*{box-sizing:border-box}body{margin:0;background:#060b12;color:#edf6ff;font:14px/1.6 "Segoe UI","Microsoft YaHei",sans-serif}header,main{max-width:1720px;margin:auto;padding:22px 26px}header{display:flex;justify-content:space-between;gap:20px;align-items:center}h1{font-size:24px;margin:0}p{color:#8da6b9;margin:4px 0}.actions{display:flex;align-items:center;gap:8px;flex-wrap:wrap}button,a.btn,select{border:1px solid #253f54;background:#102234;color:#dfedfa;padding:9px 13px;border-radius:7px;font:inherit;text-decoration:none;cursor:pointer}a.primary{background:#00b8eb;color:#03111b;font-weight:700}.active{border-color:#00d4ff;color:#00d4ff}main{padding-top:0}.screen{background:#03070b;border:1px solid #17354a;border-radius:8px;overflow:hidden}#display{display:block;width:100%;height:auto}.controls{display:flex;gap:20px;align-items:center;flex-wrap:wrap;padding:16px 0}.slider{display:flex;align-items:center;gap:10px;flex:1;min-width:250px}.slider label{white-space:nowrap}.slider input{width:100%;accent-color:#00d4ff}.slider output{min-width:86px;font-variant-numeric:tabular-nums}#status{color:#58d4ee}.gallery{display:grid;grid-template-columns:repeat(2,1fr);gap:14px;margin-top:20px}.tile{padding:0;overflow:hidden;text-align:left;background:#03070b}.tile canvas{display:block;width:100%;height:auto}.tile span{display:block;padding:9px 12px;color:#a6b9c9}.tile.selected{border-color:#00d4ff}.note{border-top:1px solid #243544;padding-top:15px}.note a{color:#72d0ff}#renderHost{position:absolute;left:-20000px;top:0;visibility:hidden;pointer-events:none}#ctxMenu{display:none}.screen:fullscreen{display:grid;place-items:center;background:#03070b}.screen:fullscreen canvas{max-height:100vh;object-fit:contain}@media(max-width:850px){header{display:block;padding:16px}.actions{margin-top:12px}main{padding:0 12px 18px}.gallery{grid-template-columns:repeat(2,1fr)}}
